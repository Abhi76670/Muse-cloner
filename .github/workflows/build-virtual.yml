name: Build Virtual Space APK

# Manual workflow: Actions tab -> "Build Virtual Space APK" -> Run workflow
#
# Ye ek open-source virtual engine (BlackBox fork, Apache-2.0) ka apna app banata hai.
# Isme har "space" alag clone hota hai, aur ek hi app ke 20 clone ban sakte hain.
#
# Repo Settings -> Secrets and variables -> Actions -> Variables me ye set kar sakte ho:
#   ENGINE_REPO : owner/repo   (default: CKAndroidProject/NewBlackbox)
#   ENGINE_REF  : commit SHA / tag (SHA pin karna safe hai, nahi to default branch ka latest code build hota hai)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPO || 'CKAndroidProject/NewBlackbox' }}
          ref: ${{ vars.ENGINE_REF || '' }}
          path: engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: sdkmanager --install "platforms;android-33" "build-tools;33.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-debug-apk
          path: engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
